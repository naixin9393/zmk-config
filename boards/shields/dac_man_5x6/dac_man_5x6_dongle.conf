CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Emit the split halves' battery levels over USB as a second HID interface
# (HID_1), so the host sees them natively (upower / /sys/class/power_supply).
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_USB_HID_BATTERY_REPORTING=y
CONFIG_ZMK_USB_HID_BATTERY_REPORTING_SPLIT=y
