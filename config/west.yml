manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: amazingbeetleking
      url-base: https://github.com/amazingbeetleking
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # Reports the split halves' battery levels over a second USB HID interface,
    # so the host can read them via upower without BLE or USB logging.
    - name: zmk-usb-reporting
      remote: amazingbeetleking
      revision: main
  self:
    path: config
